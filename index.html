<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d81b60">
<title>Raipur Beauty</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff7fa;color:#222}
header{background:#d81b60;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:700}
.cart{background:white;color:#d81b60;border:0;border-radius:22px;padding:9px 14px;font-weight:700}
.search{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;font-size:15px}
.hero{margin:16px;padding:22px;border-radius:18px;background:linear-gradient(135deg,#ffd1e2,#fff);}.hero h1{margin:0 0 8px}.hero p{margin:0 0 15px}
.btn{background:#d81b60;color:white;border:0;padding:11px 16px;border-radius:9px;font-weight:700}
section{padding:0 16px 18px}.cats{display:flex;gap:8px;overflow:auto}.cat{white-space:nowrap;background:white;border:1px solid #f1b6cb;padding:9px 13px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border-radius:14px;padding:12px;box-shadow:0 2px 10px #0000000d}.pic{height:125px;background:#f9e3ec;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:50px}.name{font-weight:700;margin:9px 0 5px}.price{font-weight:700;color:#d81b60}.add{width:100%;margin-top:8px;background:#222;color:white;border:0;padding:9px;border-radius:8px}
footer{text-align:center;padding:25px;color:#777}.empty{padding:25px;text-align:center}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10}.box{background:white;margin:12% auto;padding:20px;border-radius:16px;width:90%;max-width:420px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.close{float:right;border:0;background:none;font-size:24px}
input,select{width:100%;padding:11px;margin:7px 0;border:1px solid #ddd;border-radius:8px}
</style>
</head>
<body>
<header><div class="top"><div class="logo">💄 Raipur Beauty</div><button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button></div>
<input class="search" id="search" placeholder="Search lipstick, serum, foundation..." oninput="render()"></header>

<div class="hero"><h1>Beauty delivered in Raipur ✨</h1><p>Makeup & skincare products at your fingertips.</p><button class="btn" onclick="document.getElementById('products').scrollIntoView()">Shop Now</button></div>

<section><h2>Categories</h2><div class="cats">
<button class="cat" onclick="setCat('All')">All</button><button class="cat" onclick="setCat('Makeup')">💄 Makeup</button>
<button class="cat" onclick="setCat('Skincare')">🧴 Skincare</button><button class="cat" onclick="setCat('Haircare')">💇 Haircare</button>
</div></section>

<section id="products"><h2>Popular Products</h2><div class="grid" id="grid"></div></section>
<footer>© 2026 Raipur Beauty • Raipur, Chhattisgarh<br>Local delivery • WhatsApp orders</footer>

<div class="modal" id="cartModal"><div class="box"><button class="close" onclick="closeCart()">×</button><h2>Your Cart</h2><div id="cartItems"></div><h3>Total: ₹<span id="total">0</span></h3>
<input id="customer" placeholder="Your name"><input id="phone" placeholder="Mobile number"><input id="address" placeholder="Delivery address in Raipur">
<button class="btn" style="width:100%" onclick="orderWhatsApp()">Order on WhatsApp</button></div></div>

<script>
const products=[
{id:1,name:"Matte Lipstick",price:399,cat:"Makeup",icon:"💄"},
{id:2,name:"Hydrating Lip Oil",price:449,cat:"Makeup",icon:"💋"},
{id:3,name:"Vitamin C Face Serum",price:599,cat:"Skincare",icon:"🧴"},
{id:4,name:"Daily Face Wash",price:299,cat:"Skincare",icon:"🫧"},
{id:5,name:"Volume Mascara",price:499,cat:"Makeup",icon:"👁️"},
{id:6,name:"Kajal Liner",price:249,cat:"Makeup",icon:"🖤"},
{id:7,name:"Hair Serum",price:349,cat:"Haircare",icon:"✨"},
{id:8,name:"Moisturizer",price:399,cat:"Skincare",icon:"🌸"}
];
let cart=[],cat="All";
function setCat(c){cat=c;render()}
function render(){
let q=document.getElementById("search").value.toLowerCase();
let list=products.filter(p=>(cat==="All"||p.cat===cat)&&p.name.toLowerCase().includes(q));
document.getElementById("grid").innerHTML=list.map(p=>`<div class="card"><div class="pic">${p.icon}</div><div class="name">${p.name}</div><small>${p.cat}</small><div class="price">₹${p.price}</div><button class="add" onclick="add(${p.id})">Add to Cart</button></div>`).join("");
}
function add(id){cart.push(products.find(p=>p.id===id));updateCount();alert("Added to cart!")}
function updateCount(){document.getElementById("count").textContent=cart.length}
function openCart(){document.getElementById("cartModal").style.display="block";let t=0;let el=document.getElementById("cartItems");
if(!cart.length){el.innerHTML='<div class="empty">Cart is empty.</div>';document.getElementById("total").textContent=0;return}
el.innerHTML=cart.map((p,i)=>{t+=p.price;return `<div class="row"><span>${p.name}</span><b>₹${p.price}</b></div>`}).join("");
document.getElementById("total").textContent=t}
function closeCart(){document.getElementById("cartModal").style.display="none"}
function orderWhatsApp(){
if(!cart.length)return alert("Cart is empty");
let name=document.getElementById("customer").value||"Customer",phone=document.getElementById("phone").value||"",address=document.getElementById("address").value||"";
let items=cart.map(p=>p.name+" - ₹"+p.price).join("%0A"),total=cart.reduce((s,p)=>s+p.price,0);
let msg=`Hello Raipur Beauty,%0AName: ${encodeURIComponent(name)}%0APhone: ${encodeURIComponent(phone)}%0AAddress: ${encodeURIComponent(address)}%0A%0AOrder:%0A${items}%0A%0ATotal: ₹${total}`;
window.open("https://wa.me/?text="+msg,"_blank");
}
render();
</script>
</body></html>
